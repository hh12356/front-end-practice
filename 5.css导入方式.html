<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css导入方式</title>
    <link rel="stylesheet" href=".\css\styles.css">

    <style>
        p {
            color: blue;
            font-size: 20px;
        }
        h2{
            color:green;
        }
    </style>

</head>
<body>
    <p>应用了cs样式的文本</p>
    <h1 style="color: red;">一级标题标签：内联样式</h1>
    <h2>二级标题：内部样式</h2>
    <h3>三级标题：外部样式</h3>
</body>
</html>
