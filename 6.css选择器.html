<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css选择器</title>

    <style>
        /*元素选择器*/
        h2{
            color: yellowgreen;
        }
        /*类选择器*/
        .highlight{
            background-color: gray;
        }
        /*ID选择器*/
        #header{
            font-size: 30px;
        }
        /*通用选择器*/
        *{
            font-family: 'KaiTi';
        }
        /*子元素选择器*/
        .father>.son{
            color: gold;
        }
        /*后代选择器*/
        .father p{
            color: brown;
            font-size: larger;
        }
        /*相邻兄弟选择器*/
        h3 + p{
            background-color: rgb(76, 76, 154);
        }
        /*伪类选择器*/
        #element:hover{
            background-color: rgb(231, 231, 85);
        }
        /*
        选中第一个子元素：first-child
                        nth-child
                        active
        */
        /*伪元素选择器
        ::after
        ::before
        */

    </style>

</head>
<body>

    <h1>不同类型的css选择器</h1>

    <h2>元素选择器</h2>

    <h3 class="highlight">类选择器</h3>
    <h3>另一个类选择器</h3>

    <h4 id="header">ID选择器</h4>

    <div class="father">
        <p class="son">子元素选择器示例</p>
        <div>
            <p class="grandson">后代选择器示例</p>
        </div>
    </div>

    <p>一个普通的p标签</p>
    <h3>一个相邻兄弟选择器示例</h3>
    <p>另一个p标签</p>

    <h3 id="element">一个伪类选择器示例</h3>

</body>
</html>
