<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css选择器</title>

    <style>
        /*元素选择器*/
        h2{
            color: yellowgreen;
        }
        /*类选择器*/
        .highlight{
            background-color: gray;
        }
        /*ID选择器*/
        #header{
            font-size: 30px;
        }
        /*通用选择器*/
        *{
            font-family: 'KaiTi';
        }
    </style>

</head>
<body>

    <h1>不同类型的css选择器</h1>

    <h2>元素选择器</h2>

    <h3 class="highlight">类选择器</h3>
    <h3>另一个类选择器</h3>

    <h4 id="header">ID选择器</h4>

</body>
</html>
