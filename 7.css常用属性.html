<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css常用属性</title>
    <style>
        .block{
            background-color: aquamarine;
            width: 200px;
            height: 200px;
        }
        .inline{
            background-color: plum;
            width: 200px;
            height: 200px;/*无效，长宽只由内容决定*/
        }
        .inline-block{
            height: 75px;
            width: 175px;
        }
        .div-inline{
            display:inline;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1 style="font: bolder 50px 'KaiTi';">一个font复合属性示例</h1>
    <p style="line-height: 40px;">一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本一段长文本</p>

    <div class="block">一个块级元素</div>
    <span class="inline">一个行内元素</span>
    <img src="./whu.png" alt="" class="inline-block">
    <img src="./whu.png" alt="" class="inline-block">

    <h2>display</h2>
    <div class="div-inline">一个转成行内元素的div标签</div>

</body>
</html>
