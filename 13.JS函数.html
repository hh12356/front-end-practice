<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript函数</title>
</head>
<body>
    <script>
        function hello(){
            console.log("Hello World!");
        }

        hello();

        function hello_return(){
            return "Hello Return!";
        }

        console.log(hello_return());

        function hello_sb(name){
            console.log("Hello "+ name + '!');
        }

        hello_sb("Miles")
        
    </script>
</body>
</html>
