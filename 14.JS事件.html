<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript事件</title>
</head>
<body>
    <button onclick="click_event()">点击</button>
    <br>
    <input type="text" onfocus="focus_event()" onblur="blur_event()">
    <script>
        //点击事件
        function click_event(){
            alert("点击了")
        }
        //聚焦事件
        function focus_event(){
            console.log("聚焦了");
        }
        //失焦事件
        function blur_event(){
            console.log("失焦了");
        }
    </script>
</body>
</html>
